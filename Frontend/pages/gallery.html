<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Book - Nail Art Gallery</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!-- Mobile nav -->
<div class="mobile-nav">
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    <span class="mobile-nav-logo">💅 Glow Book</span>
    <div style="width:40px"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout-wrap">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">

        <!-- ── Topbar ── -->
        <div class="topbar">
            <div>
                <h1>Nail Art Gallery</h1>
                <p>Zbulo dizajnet më të bukura · <span id="totalCount">0</span> dizajne</p>
            </div>
            <button class="btn-primary gl-add-btn" data-admin onclick="openAddModal()">
                <i class="fa-solid fa-plus"></i> Shto Dizajn
            </button>
        </div>

        <!-- ── Stats row ── -->
        <div class="gl-stats-row">
            <div class="gl-stat">
                <div class="gl-stat-icon" style="background:linear-gradient(135deg,#F8F4FF,#EEEDFE)">💅</div>
                <div class="gl-stat-info">
                    <span class="gl-stat-val" id="stTotal">0</span>
                    <span class="gl-stat-lbl">Dizajne Gjithsej</span>
                </div>
            </div>
            <div class="gl-stat">
                <div class="gl-stat-icon" style="background:linear-gradient(135deg,#E1F5EE,#B7EAD9)">✅</div>
                <div class="gl-stat-info">
                    <span class="gl-stat-val" id="stEasy">0</span>
                    <span class="gl-stat-lbl">Të Lehta</span>
                </div>
            </div>
            <div class="gl-stat">
                <div class="gl-stat-icon" style="background:linear-gradient(135deg,#FAEEDA,#F5D5A0)">⚡</div>
                <div class="gl-stat-info">
                    <span class="gl-stat-val" id="stMed">0</span>
                    <span class="gl-stat-lbl">Mesatare</span>
                </div>
            </div>
            <div class="gl-stat">
                <div class="gl-stat-icon" style="background:linear-gradient(135deg,#FCEBEB,#F8C4C4)">🎨</div>
                <div class="gl-stat-info">
                    <span class="gl-stat-val" id="stHard">0</span>
                    <span class="gl-stat-lbl">Të Vështira</span>
                </div>
            </div>
            <div class="gl-stat">
                <div class="gl-stat-icon" style="background:linear-gradient(135deg,#FBEAF0,#F4C0D1)">❤️</div>
                <div class="gl-stat-info">
                    <span class="gl-stat-val" id="stLikes">0</span>
                    <span class="gl-stat-lbl">Të Pëlqyera</span>
                </div>
            </div>
        </div>

        <!-- ── Search + filter pills ── -->
        <div class="gl-filter-bar">
            <div class="gl-search-wrap">
                <i class="fa-solid fa-magnifying-glass gl-search-icon"></i>
                <input class="gl-search" type="text" id="searchInput" placeholder="Kërko dizajn, kategori..." oninput="applyFilters()">
                <button class="gl-search-clear" id="searchClear" onclick="clearSearch()" title="Pastro kërkimin">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="gl-pills" id="pillsContainer">
                <!-- built by JS -->
            </div>
        </div>

        <!-- ── View toggle ── -->
        <div class="gl-view-bar">
            <span class="gl-results-count" id="resultsCount">Duke ngarkuar...</span>
            <div class="gl-view-btns">
                <button class="gl-view-btn active" id="btnGrid"  onclick="setView('grid')"  title="Pamja Grid">
                    <i class="fa-solid fa-grip"></i>
                </button>
                <button class="gl-view-btn" id="btnList" onclick="setView('list')"  title="Pamja List">
                    <i class="fa-solid fa-list"></i>
                </button>
                <button class="gl-view-btn" id="btnCats" onclick="setView('category')" title="Sipas Kategorisë">
                    <i class="fa-solid fa-layer-group"></i>
                </button>
            </div>
        </div>

        <!-- ── Gallery container ── -->
        <div id="galleryContainer"></div>

    </main>
</div>

<!-- ================================================================
     DETAIL MODAL
     ================================================================ -->
<div class="gl-detail-overlay" id="detailOverlay">
    <div class="gl-detail-modal">

        <button class="gl-detail-close" onclick="closeDetailModal()" aria-label="Mbyll">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Image -->
        <div class="gl-detail-img-wrap">
            <img src="" alt="" id="detailImg" class="gl-detail-img">
            <div class="gl-detail-img-placeholder" id="detailPlaceholder">
                <i class="fa-solid fa-image"></i>
            </div>
            <button class="gl-detail-like" id="detailLikeBtn" onclick="toggleLikeFromModal()">
                <i class="fa-heart" id="detailLikeIcon"></i>
                <span id="detailLikeCount">0</span>
            </button>
        </div>

        <!-- Body -->
        <div class="gl-detail-body">
            <div class="gl-detail-header">
                <div>
                    <span class="gl-detail-cat" id="detailCat">–</span>
                    <h2 class="gl-detail-title" id="detailName">–</h2>
                </div>
                <div class="gl-detail-price-wrap">
                    <span class="gl-detail-price" id="detailPrice">–</span>
                    <span class="gl-detail-dur"   id="detailDur">–</span>
                </div>
            </div>

            <p class="gl-detail-desc" id="detailDesc">–</p>

            <div class="gl-detail-tags" id="detailTags"></div>

            <div class="gl-detail-meta">
                <span class="gl-complexity-badge" id="detailComp">–</span>
            </div>

            <div class="gl-detail-actions">
                <button class="btn-secondary" onclick="closeDetailModal()">
                    <i class="fa-solid fa-xmark"></i> Mbyll
                </button>
                <button class="btn-primary" onclick="bookDesign()">
                    <i class="fa-solid fa-calendar-check"></i> Rezervo këtë Stil
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ================================================================
     ADMIN: ADD / EDIT MODAL
     ================================================================ -->
<div class="modal-overlay" id="addModal">
    <div class="modal" style="max-width:520px">
        <h2 class="modal-title" id="addModalTitle">Shto Dizajn të Ri</h2>

        <div class="gl-form-row">
            <div class="field">
                <label>Emri i Dizajnit *</label>
                <input type="text" id="dName" placeholder="p.sh. Rose Gold Chrome">
            </div>
            <div class="field">
                <label>Kategoria *</label>
                <select id="dCat">
                    <option value="French">French</option>
                    <option value="Gel">Gel</option>
                    <option value="Ombre">Ombre</option>
                    <option value="Floral">Floral</option>
                    <option value="Glitter">Glitter</option>
                    <option value="Chrome">Chrome / Mirror</option>
                    <option value="Animal Print">Animal Print</option>
                    <option value="Abstract">Abstract</option>
                    <option value="Swirls">Swirls</option>
                    <option value="3D">3D Nails</option>
                    <option value="Foil">Foil Nails</option>
                    <option value="Seasonal">Seasonal</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label>
                Shtegu i Imazhit *
                <small style="color:var(--text-muted);font-weight:400">
                    (p.sh. ../images/gallery/chrome/chrome1.jpg)
                </small>
            </label>
            <div class="gl-img-input-wrap">
                <i class="fa-solid fa-image" style="color:var(--pink-border);margin-right:8px"></i>
                <input type="text" id="dImage" placeholder="../images/gallery/chrome/chrome1.jpg" oninput="previewAdminImg()">
            </div>
            <div class="gl-img-preview-wrap">
                <img id="adminImgPreview" src="" alt="" class="gl-admin-img-preview" style="display:none">
                <div class="gl-admin-img-placeholder" id="adminImgPlaceholder">
                    <i class="fa-solid fa-image"></i>
                    <span>Pamja paraprake e imazhit</span>
                </div>
            </div>
        </div>

        <div class="gl-form-row">
            <div class="field">
                <label>Vështirësia</label>
                <select id="dComp">
                    <option value="E lehtë">E lehtë</option>
                    <option value="Mesatare">Mesatare</option>
                    <option value="E vështirë">E vështirë</option>
                </select>
            </div>
            <div class="field">
                <label>Çmimi (€)</label>
                <input type="number" id="dPrice" placeholder="25" min="1">
            </div>
            <div class="field">
                <label>Kohëzgjatja (min)</label>
                <input type="number" id="dDur" placeholder="45" min="5">
            </div>
        </div>

        <div class="field">
            <label>Përshkrimi</label>
            <input type="text" id="dDesc" placeholder="Përshkrim i shkurtër dhe tërheqës...">
        </div>

        <div class="field">
            <label>
                Etiketat (tags)
                <small style="color:var(--text-muted);font-weight:400">ndaj me presje</small>
            </label>
            <input type="text" id="dTags" placeholder="Modern, Trendy, Bold">
        </div>

        <div class="modal-footer">
            <button class="btn-secondary" style="flex:1" onclick="closeAddModal()">Anulo</button>
            <button class="btn-primary"   style="flex:2" id="addModalSaveBtn" onclick="saveDesign()">
                <i class="fa-solid fa-floppy-disk"></i> Ruaj Dizajnin
            </button>
        </div>
    </div>
</div>

<div class="gb-toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script src="../js/gallery.js"></script>
</body>
</html>
