<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Book - Galeria</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="mobile-nav">
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    <span class="mobile-nav-logo">💅 Glow Book</span>
    <div style="width:40px"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout-wrap">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1>Nail Art Gallery</h1>
                <p>Zbulo dizajnet më të bukura</p>
            </div>
            <!-- Admin only -->
            <button class="btn-primary" data-admin onclick="openAddModal()">
                <i class="fa-solid fa-plus"></i> Shto Dizajn
            </button>
        </div>

        <!-- Stats -->
        <div class="gallery-stats">
            <div class="gallery-stat"><div class="n" id="stTotal">0</div><div class="l">Dizajne</div></div>
            <div class="gallery-stat"><div class="n" id="stEasy">0</div><div class="l">Të lehta</div></div>
            <div class="gallery-stat"><div class="n" id="stMed">0</div><div class="l">Mesatare</div></div>
            <div class="gallery-stat"><div class="n" id="stHard">0</div><div class="l">Të vështira</div></div>
        </div>

        <!-- Filters -->
        <div class="filters" style="margin-bottom:1.5rem">
            <div class="filter-pills">
                <input class="search-box" type="text" id="searchInput" placeholder="🔍 Kërko dizajn..." oninput="renderGallery()">
                <button class="pill active" onclick="setFilter('Të gjitha')">Të gjitha</button>
                <button class="pill" onclick="setFilter('French')">French</button>
                <button class="pill" onclick="setFilter('Gel')">Gel</button>
                <button class="pill" onclick="setFilter('Ombre')">Ombre</button>
                <button class="pill" onclick="setFilter('Floral')">Floral</button>
                <button class="pill" onclick="setFilter('Glitter')">Glitter</button>
            </div>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>
    </main>
</div>

<!-- Design detail modal -->
<div class="gallery-modal-bg" id="modalBg">
    <div class="gallery-modal">
        <div class="gallery-modal-preview" id="modalPreview"></div>
        <div class="gallery-modal-body">
            <h2 id="modalName">–</h2>
            <p id="modalDesc">–</p>
            <div class="modal-tags" id="modalTags"></div>
            <div class="gallery-modal-footer">
                <div>
                    <div class="modal-price"    id="modalPrice">–</div>
                    <div class="modal-duration" id="modalDuration">–</div>
                </div>
                <div style="display:flex;gap:8px">
                    <button class="btn-secondary" onclick="closeDetailModal()">Mbyll</button>
                    <button class="btn-primary"   onclick="bookDesign()">
                        <i class="fa-solid fa-calendar-check"></i> Rezervo
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Admin: Add / Edit design modal -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h2 class="modal-title" id="addModalTitle">Shto Dizajn të Ri</h2>
        <div class="field"><label>Emri</label><input type="text" id="dName" placeholder="Rose Gold Tips"></div>
        <div class="field"><label>Emoji / Ikona</label><input type="text" id="dEmoji" placeholder="💅" maxlength="4"></div>
        <div class="field"><label>Kategoria</label>
            <select id="dCat">
                <option>French</option><option>Gel</option><option>Ombre</option>
                <option>Floral</option><option>Glitter</option>
            </select>
        </div>
        <div class="field"><label>Vështirësia</label>
            <select id="dComp">
                <option value="E lehtë">E lehtë</option>
                <option value="Mesatare">Mesatare</option>
                <option value="E vështirë">E vështirë</option>
            </select>
        </div>
        <div class="field"><label>Çmimi (€)</label><input type="number" id="dPrice" placeholder="20" min="1"></div>
        <div class="field"><label>Kohëzgjatja (min)</label><input type="number" id="dDur" placeholder="45" min="5"></div>
        <div class="field"><label>Përshkrimi</label><input type="text" id="dDesc" placeholder="Përshkrim i shkurtër..."></div>
        <div class="modal-footer">
            <button class="btn-secondary" style="flex:1" onclick="closeAddModal()">Anulo</button>
            <button class="btn-primary"   style="flex:2" id="addModalSaveBtn" onclick="saveDesign()">
                <i class="fa-solid fa-floppy-disk"></i> Ruaj
            </button>
        </div>
    </div>
</div>

<div class="gb-toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script>
'use strict';
GB.init({ page: 'gallery' });

const isAdmin = GB.isAdmin();
let   currentFilter   = 'Të gjitha';
let   currentDesignId = null;
let   editingDesignId = null;

/* ── Gallery rendering ──────────────────────────────────── */
function setFilter(cat) {
    currentFilter = cat;
    document.querySelectorAll('.pill').forEach(b =>
        b.classList.toggle('active', b.textContent.trim() === cat));
    renderGallery();
}

function renderGallery() {
    const search  = document.getElementById('searchInput').value.toLowerCase();
    const designs = GB.designs.getAll();
    const shown   = designs.filter(d =>
        (currentFilter === 'Të gjitha' || d.category === currentFilter) &&
        (!search || d.name.toLowerCase().includes(search) || d.category.toLowerCase().includes(search))
    );

    /* Stats */
    document.getElementById('stTotal').textContent = designs.length;
    document.getElementById('stEasy').textContent  = designs.filter(d => d.complexity === 'E lehtë').length;
    document.getElementById('stMed').textContent   = designs.filter(d => d.complexity === 'Mesatare').length;
    document.getElementById('stHard').textContent  = designs.filter(d => d.complexity === 'E vështirë').length;

    const grid = document.getElementById('galleryGrid');
    if (!shown.length) {
        grid.innerHTML = '<div style="color:var(--text-muted);font-size:.85rem;padding:2rem">Nuk ka dizajne për këtë filtrim.</div>';
        return;
    }

    grid.innerHTML = shown.map(d => {
        const cc = d.complexity === 'E lehtë' ? 'complexity-easy'
                 : d.complexity === 'Mesatare' ? 'complexity-medium'
                 : 'complexity-hard';

        /* Admin controls — hidden from clients via [data-admin] + CSS */
        const adminBar = isAdmin ? `
            <div class="design-admin-bar" data-admin>
                <button class="btn-sm btn-edit"   style="flex:1" onclick="event.stopPropagation();openEditModal(${d.id})">
                    <i class="fa-solid fa-pen"></i> Edito
                </button>
                <button class="btn-sm btn-delete" style="flex:1" onclick="event.stopPropagation();deleteDesign(${d.id})">
                    <i class="fa-solid fa-trash"></i> Fshi
                </button>
            </div>` : '';

        return `<div class="design-card" onclick="openDetailModal(${d.id})">
            <div class="design-preview" style="background:${d.bg}">${d.emoji}</div>
            <div class="design-card-body">
                <div class="design-name">${d.name}</div>
                <div class="design-desc">${(d.desc||'').substring(0,60)}…</div>
                <div class="design-footer">
                    <span class="design-complexity ${cc}">${d.complexity}</span>
                    <span class="design-price">€${d.price}</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
                    <span style="font-size:.75rem;color:var(--text-muted)">${d.duration} min</span>
                    <button class="like-btn" onclick="event.stopPropagation();toggleLike(${d.id})" id="like-${d.id}">
                        ${d.liked ? '❤️' : '🤍'} ${d.likes}
                    </button>
                </div>
                ${adminBar}
            </div>
        </div>`;
    }).join('');
}

/* ── Like ───────────────────────────────────────────────── */
function toggleLike(id) {
    const designs = GB.designs.getAll();
    const d = designs.find(x => x.id === id);
    if (!d) return;
    d.liked  = !d.liked;
    d.likes += d.liked ? 1 : -1;
    GB.designs.save(designs);
    const btn = document.getElementById(`like-${id}`);
    if (btn) btn.textContent = (d.liked ? '❤️' : '🤍') + ' ' + d.likes;
}

/* ── Detail modal ───────────────────────────────────────── */
function openDetailModal(id) {
    const d = GB.designs.getAll().find(x => x.id === id);
    if (!d) return;
    currentDesignId = id;
    const mp = document.getElementById('modalPreview');
    mp.style.background = d.bg;
    mp.style.fontSize   = '7rem';
    mp.textContent      = d.emoji;
    document.getElementById('modalName').textContent     = d.name;
    document.getElementById('modalDesc').textContent     = d.desc || '';
    document.getElementById('modalPrice').textContent    = '€' + d.price;
    document.getElementById('modalDuration').textContent = d.duration + ' minuta';
    document.getElementById('modalTags').innerHTML       = (d.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
    document.getElementById('modalBg').classList.add('open');
}

function closeDetailModal() { document.getElementById('modalBg').classList.remove('open'); }
function bookDesign()       { closeDetailModal(); window.location.href = 'appointments.html'; }

/* ── Add modal ──────────────────────────────────────────── */
function openAddModal() {
    editingDesignId = null;
    document.getElementById('addModalTitle').textContent      = 'Shto Dizajn të Ri';
    document.getElementById('addModalSaveBtn').innerHTML      = '<i class="fa-solid fa-floppy-disk"></i> Shto';
    ['dName','dEmoji','dPrice','dDur','dDesc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('dCat').value  = 'French';
    document.getElementById('dComp').value = 'E lehtë';
    document.getElementById('addModal').classList.add('open');
}

function openEditModal(id) {
    const d = GB.designs.getAll().find(x => x.id === id);
    if (!d) return;
    editingDesignId = id;
    document.getElementById('addModalTitle').textContent = 'Edito Dizajnin';
    document.getElementById('addModalSaveBtn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Ruaj';
    document.getElementById('dName').value  = d.name;
    document.getElementById('dEmoji').value = d.emoji;
    document.getElementById('dCat').value   = d.category;
    document.getElementById('dComp').value  = d.complexity;
    document.getElementById('dPrice').value = d.price;
    document.getElementById('dDur').value   = d.duration;
    document.getElementById('dDesc').value  = d.desc;
    document.getElementById('addModal').classList.add('open');
}

function closeAddModal() { document.getElementById('addModal').classList.remove('open'); editingDesignId = null; }

function saveDesign() {
    const name  = document.getElementById('dName').value.trim();
    if (!name) { GB.toast('Shkruani emrin e dizajnit!', 'error'); return; }

    const bgs  = ['#F8F4FF','#FFF0F5','#FFFBF0','#F0FFF4','#FFF5F0','#F0F0FF','#F8F8F8','#FFF0F8','#FFFDF0','#F8F0FF'];
    const cat  = document.getElementById('dCat').value;

    if (editingDesignId) {
        GB.designs.update(editingDesignId, {
            name, emoji: document.getElementById('dEmoji').value.trim() || '💅',
            category: cat, complexity: document.getElementById('dComp').value,
            price: parseFloat(document.getElementById('dPrice').value) || 0,
            duration: parseInt(document.getElementById('dDur').value) || 30,
            desc: document.getElementById('dDesc').value.trim(),
            tags: [cat],
        });
        GB.toast(`"${name}" u përditësua!`, 'success');
    } else {
        GB.designs.add({
            name, emoji: document.getElementById('dEmoji').value.trim() || '💅',
            category: cat, complexity: document.getElementById('dComp').value,
            price: parseFloat(document.getElementById('dPrice').value) || 0,
            duration: parseInt(document.getElementById('dDur').value) || 30,
            desc: document.getElementById('dDesc').value.trim(),
            tags: [cat],
            bg: bgs[GB.designs.count() % bgs.length],
        });
        GB.toast(`"${name}" u shtua!`, 'success');
    }
    closeAddModal();
    renderGallery();
}

function deleteDesign(id) {
    const d = GB.designs.getAll().find(x => x.id === id);
    if (!d) return;
    if (!confirm(`A jeni të sigurt që dëshironi të fshini "${d.name}"?`)) return;
    GB.designs.delete(id);
    GB.toast('Dizajni u fshi!', 'success');
    renderGallery();
}

/* Close modals */
document.getElementById('modalBg').addEventListener('click',  e => { if (e.target === document.getElementById('modalBg'))  closeDetailModal(); });
document.getElementById('addModal').addEventListener('click', e => { if (e.target === document.getElementById('addModal')) closeAddModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDetailModal(); closeAddModal(); } });

renderGallery();
</script>
</body>
</html>
