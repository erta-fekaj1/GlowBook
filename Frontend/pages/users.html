<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Book - Users</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="mobile-nav">
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    <span class="mobile-nav-logo">💅 Glow Book</span>
    <div style="width:40px"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout-wrap">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1>Users</h1>
                <p>Manage staff and salon clients</p>
            </div>
            <button class="btn-primary" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> Shto Përdorues
            </button>
        </div>

        <!-- Stats mini -->
        <div class="stats-row">
            <div class="stat-mini"><div class="val" id="stAll">0</div><div class="lbl">Gjithsej</div></div>
            <div class="stat-mini"><div class="val" id="stAdm">0</div><div class="lbl">Admin</div></div>
            <div class="stat-mini"><div class="val" id="stCus">0</div><div class="lbl">Klientë</div></div>
        </div>

        <div class="filters">
            <input  type="text"   id="filterName" placeholder="🔍 Kërko me emër ose email..." oninput="renderTable()">
            <select id="filterRole" onchange="renderTable()">
                <option value="">Të gjitha rolet</option>
                <option value="Admin">Admin</option>
                <option value="Customer">Customer</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Përdoruesi</th>
                        <th>Email</th>
                        <th>Telefoni</th>
                        <th>Roli</th>
                        <th>Regjistruar</th>
                        <th>Takime</th>
                        <th>Veprimet</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:2rem">Duke ngarkuar...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal: Add / Edit user -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 class="modal-title" id="modalTitle">Shto Përdorues</h2>
        <div class="field"><label>Emri i Plotë</label><input type="text"     id="uName"     placeholder="Ana Krasniqi"></div>
        <div class="field"><label>Email</label>        <input type="email"    id="uEmail"    placeholder="ana@example.com"></div>
        <div class="field"><label>Fjalëkalimi</label>  <input type="password" id="uPassword" placeholder="Lëre bosh për të mbajtur"></div>
        <div class="field"><label>Telefoni</label>     <input type="tel"      id="uPhone"    placeholder="044 123 456"></div>
        <div class="field">
            <label>Roli</label>
            <select id="uRole">
                <option value="Customer">Customer</option>
                <option value="Admin">Admin</option>
            </select>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" style="flex:1" onclick="closeModal()">Anulo</button>
            <button class="btn-primary"   style="flex:2" onclick="saveUser()">
                <i class="fa-solid fa-floppy-disk"></i> Ruaj
            </button>
        </div>
    </div>
</div>

<div class="gb-toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script>
'use strict';
/* Admin-only page — clients redirected to dashboard */
GB.init({ page: 'users', admin: true });

GB.toast('Menaxhimi i përdoruesve është integruar te Admin Control Center.', 'info');
window.location.replace('admin.html#appointments');

let editingId = null;

function renderStats() {
    const all = GB.users.getAll();
    document.getElementById('stAll').textContent = all.length;
    document.getElementById('stAdm').textContent = GB.users.admins().length;
    document.getElementById('stCus').textContent = GB.users.customers().length;
}

function renderTable() {
    const fn  = document.getElementById('filterName').value.toLowerCase();
    const fr  = document.getElementById('filterRole').value;

    const all = GB.users.getAll().filter(u =>
        (!fn || u.name.toLowerCase().includes(fn) || u.email.toLowerCase().includes(fn)) &&
        (!fr || u.role === fr)
    );

    const tbody = document.getElementById('usersTable');
    if (!all.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted)">Nuk u gjet asnjë përdorues.</td></tr>';
        return;
    }

    tbody.innerHTML = all.map(u => {
        const ini     = u.name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        const bc      = u.role === 'Admin' ? 'badge-admin' : 'badge-customer';
        const apptCnt = GB.appointments.getByUser(u.email).length;
        const date    = u.createdAt ? new Date(u.createdAt).toLocaleDateString('sq-AL') : '–';
        return `<tr>
            <td>
                <div style="display:flex;align-items:center;gap:10px">
                    <div class="user-avatar-sm">${ini}</div>
                    <strong>${u.name}</strong>
                </div>
            </td>
            <td style="color:var(--text-subtle)">${u.email}</td>
            <td style="color:var(--text-subtle)">${u.phone || '–'}</td>
            <td><span class="badge ${bc}">${u.role}</span></td>
            <td style="color:var(--text-subtle);font-size:.82rem">${date}</td>
            <td style="text-align:center">
                <span class="badge badge-confirmed">${apptCnt}</span>
            </td>
            <td>
                <div style="display:flex;gap:6px">
                    <button class="btn-sm btn-view"   onclick="viewProfile(${u.id})"   title="Profili"><i class="fa-solid fa-eye"></i></button>
                    <button class="btn-sm btn-edit"   onclick="editUser(${u.id})"     title="Edito"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn-sm btn-delete" onclick="deleteUser(${u.id})"   title="Fshi"><i class="fa-solid fa-trash"></i></button>
                </div>
            </td>
        </tr>`;
    }).join('');
}

function openModal(id = null) {
    editingId = id;
    document.getElementById('modalTitle').textContent = id ? 'Edito Përdoruesin' : 'Shto Përdorues të Ri';
    if (!id) {
        ['uName','uEmail','uPassword','uPhone'].forEach(i => document.getElementById(i).value = '');
        document.getElementById('uRole').value = 'Customer';
    }
    document.getElementById('modalOverlay').classList.add('open');
}

function editUser(id) {
    const u = GB.users.getById(id);
    if (!u) return;
    openModal(id);
    document.getElementById('uName').value  = u.name;
    document.getElementById('uEmail').value = u.email;
    document.getElementById('uPhone').value = u.phone || '';
    document.getElementById('uRole').value  = u.role;
    document.getElementById('uPassword').value = '';
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }

function saveUser() {
    const name     = document.getElementById('uName').value.trim();
    const email    = document.getElementById('uEmail').value.trim();
    const password = document.getElementById('uPassword').value;
    const phone    = document.getElementById('uPhone').value.trim();
    const role     = document.getElementById('uRole').value;

    if (!name)  { GB.toast('Shkruani emrin!', 'error'); return; }
    if (!email) { GB.toast('Shkruani email-in!', 'error'); return; }

    if (editingId) {
        const fields = { name, email, phone, role };
        if (password) fields.password = password;
        const res = GB.users.update(editingId, fields);
        if (res.ok) { GB.toast('Përdoruesi u përditësua!', 'success'); closeModal(); renderTable(); renderStats(); }
        else          GB.toast(res.error, 'error');
    } else {
        if (!password || password.length < 4) { GB.toast('Fjalëkalimi duhet ≥ 4 karaktere!', 'error'); return; }
        /* Use register flow to properly hash password */
        const res = GB.register({ name, email, password, phone });
        if (res.ok) {
            /* Override role if admin selected */
            if (role === 'Admin') {
                const newU = GB.users.getByEmail(email);
                if (newU) GB.users.update(newU.id, { role: 'Admin' });
            }
            GB.toast('Përdoruesi u shtua!', 'success');
            closeModal(); renderTable(); renderStats();
        } else {
            GB.toast(res.error, 'error');
        }
    }
}

function deleteUser(id) {
    const u = GB.users.getById(id);
    if (!u) return;
    if (u.email === GB.getMe()?.email) { GB.toast('Nuk mund të fshini llogarinë tuaj!', 'error'); return; }
    if (!confirm(`A jeni të sigurt që dëshironi të fshini "${u.name}"?`)) return;
    GB.users.delete(id);
    GB.toast('Përdoruesi u fshi!', 'success');
    renderTable(); renderStats();
}

function viewProfile(id) { window.location.href = `profile.html?id=${id}`; }

document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

renderStats();
renderTable();
</script>
</body>
</html>
