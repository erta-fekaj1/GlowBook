<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Book - Takimet</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="mobile-nav">
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    <span class="mobile-nav-logo">💅 Glow Book</span>
    <div style="width:40px"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout-wrap">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1>Takimet</h1>
                <p id="apptSub">Takimet tuaja të rezervuara</p>
            </div>
            <button class="btn-primary" id="topActionBtn" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> Shto Takim
            </button>
        </div>

        <!-- Filters: search client name only visible to admin -->
        <div class="filters">
            <input type="text" id="filterUser" placeholder="🔍 Kërko klient..."
                oninput="renderTable()" data-admin>
            <select id="filterStatus" onchange="renderTable()">
                <option value="">Të gjitha statuset</option>
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Done">Done</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Klienti</th>
                        <th>Shërbimi</th>
                        <th>Data &amp; Ora</th>
                        <th>Statusi</th>
                        <th>Veprimet</th>
                    </tr>
                </thead>
                <tbody id="apptTable">
                    <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:2rem">Duke ngarkuar...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal: Shto / Edito takim -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 class="modal-title" id="modalTitle">Shto Takim</h2>

        <!-- Client selector — admin only -->
        <div class="field" data-admin>
            <label>Klienti</label>
            <select id="apptUser"></select>
        </div>

        <div class="field">
            <label>Shërbimi</label>
            <select id="apptService"></select>
        </div>

        <div class="field">
            <label>Data dhe Ora</label>
            <input type="datetime-local" id="apptDate">
        </div>

        <div class="field" data-admin>
            <label>Statusi</label>
            <select id="apptStatus">
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Done">Done</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>

        <div class="field">
            <label>Shënime</label>
            <input type="text" id="apptNotes" placeholder="Shënime shtesë...">
        </div>

        <div class="modal-footer">
            <button class="btn-secondary" style="flex:1" onclick="closeModal()">Anulo</button>
            <button class="btn-primary"   style="flex:2" onclick="saveAppt()">
                <i class="fa-solid fa-floppy-disk"></i> Ruaj
            </button>
        </div>
    </div>
</div>

<div class="gb-toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script>
'use strict';
GB.init({ page: 'appointments' });

const isAdmin  = GB.isAdmin();
const me       = GB.getMe();
let   editingId = null;

if (!isAdmin) {
    GB.toast('Rezervimi dhe pagesa bëhen te Book Appointment.', 'info');
    window.location.replace('booking.html');
}

/* Subtitle */
document.getElementById('apptSub').textContent = isAdmin
    ? 'Menaxho të gjitha takimet'
    : 'Takimet tuaja të rezervuara';

if (!isAdmin) {
    const topActionBtn = document.getElementById('topActionBtn');
    topActionBtn.innerHTML = '<i class="fa-solid fa-calendar-plus"></i> Prenoto Takim';
    topActionBtn.onclick = () => window.location.href = 'booking.html';
}

/* Populate selects */
function populateSelects() {
    /* Users — admin only */
    const uSel = document.getElementById('apptUser');
    if (isAdmin) {
        const users = GB.users.getAll();
        uSel.innerHTML = users.map(u =>
            `<option value="${u.id}" data-email="${u.email}" data-name="${u.name}">
                ${u.name} (${u.email})
            </option>`
        ).join('');
    }

    /* Services */
    const sSel = document.getElementById('apptService');
    sSel.innerHTML = GB.services.getAll().map(s =>
        `<option value="${s.id}" data-name="${s.name}">
            ${s.name} — €${s.price}
        </option>`
    ).join('');
}

/* Render table */
function renderTable() {
    const fu = (document.getElementById('filterUser')?.value || '').toLowerCase();
    const fs = document.getElementById('filterStatus').value;

    /* Admin sees all; client sees only own */
    let appts = isAdmin
        ? GB.appointments.getAll()
        : GB.appointments.getByUser(me.email);

    if (fu) appts = appts.filter(a =>
        (a.userName || '').toLowerCase().includes(fu) ||
        (a.userEmail || '').toLowerCase().includes(fu)
    );
    if (fs) appts = appts.filter(a => a.status === fs);

    /* Newest first */
    appts = [...appts].reverse();

    const tbody = document.getElementById('apptTable');
    if (!appts.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted)">
            ${isAdmin ? 'Nuk ka takime.' : 'Nuk keni asnjë takim akoma. <a href="booking.html" style="color:var(--pink)">Prenoto takim →</a>'}
        </td></tr>`;
        return;
    }

    tbody.innerHTML = appts.map(a => {
        const bc   = `badge-${a.status.toLowerCase()}`;
        const date = a.date
            ? new Date(a.date).toLocaleString('sq-AL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
            : '–';

        const actions = isAdmin
            ? `<div style="display:flex;gap:6px">
                   <button class="btn-sm btn-edit"   onclick="editAppt(${a.id})"><i class="fa-solid fa-pen"></i>  Edito</button>
                   <button class="btn-sm btn-delete" onclick="deleteAppt(${a.id})"><i class="fa-solid fa-trash"></i> Fshi</button>
               </div>`
            : (a.status === 'Pending'
                ? `<button class="btn-sm btn-delete" onclick="deleteAppt(${a.id})"><i class="fa-solid fa-xmark"></i> Anulo</button>`
                : `<span style="color:var(--text-muted);font-size:.78rem">–</span>`);

        return `<tr>
            <td style="color:var(--text-muted);font-size:.78rem">#${a.id}</td>
            <td><strong>${a.userName || a.userEmail}</strong><br>
                <span style="font-size:.74rem;color:var(--text-muted)">${a.userEmail}</span></td>
            <td>${a.serviceName || '–'}</td>
            <td>${date}</td>
            <td><span class="badge ${bc}">${a.status}</span></td>
            <td>${actions}</td>
        </tr>`;
    }).join('');
}

/* Open modal */
function openModal(id = null) {
    editingId = id;
    populateSelects();
    document.getElementById('modalTitle').textContent = id ? 'Edito Takim' : 'Shto Takim të Ri';

    if (!id) {
        document.getElementById('apptDate').value   = '';
        document.getElementById('apptNotes').value  = '';
        document.getElementById('apptStatus').value = 'Pending';
    }
    document.getElementById('modalOverlay').classList.add('open');
}

/* Edit existing */
function editAppt(id) {
    const a = GB.appointments.getById(id);
    if (!a) return;
    openModal(id);

    /* Pre-fill */
    if (isAdmin) {
        const users = GB.users.getAll();
        const u     = users.find(x => x.email === a.userEmail);
        if (u) document.getElementById('apptUser').value = u.id;
    }
    document.getElementById('apptService').value = a.serviceId;
    document.getElementById('apptStatus').value  = a.status;
    document.getElementById('apptNotes').value   = a.notes || '';

    if (a.date) {
        const d = new Date(a.date);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        document.getElementById('apptDate').value = d.toISOString().slice(0, 16);
    }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
}

/* Save */
function saveAppt() {
    const date = document.getElementById('apptDate').value;
    if (!date) { GB.toast('Zgjidhni datën dhe orën!', 'error'); return; }

    /* Resolve user */
    let userEmail, userName, userId;
    if (isAdmin) {
        const sel  = document.getElementById('apptUser');
        const opt  = sel.options[sel.selectedIndex];
        userEmail  = opt.dataset.email;
        userName   = opt.dataset.name;
        userId     = parseInt(sel.value);
    } else {
        userEmail  = me.email;
        userName   = me.name;
        userId     = me.id;
    }

    /* Resolve service */
    const sSel        = document.getElementById('apptService');
    const sOpt        = sSel.options[sSel.selectedIndex];
    const serviceId   = parseInt(sSel.value);
    const serviceName = sOpt.dataset.name || sOpt.text.split('—')[0].trim();

    const status = isAdmin
        ? document.getElementById('apptStatus').value
        : 'Pending';
    const notes  = document.getElementById('apptNotes').value;

    if (editingId) {
        const res = GB.appointments.update(editingId, {
            userEmail, userName, userId,
            serviceId, serviceName, date, status, notes
        });
        if (res.ok) { GB.toast('Takimi u përditësua!', 'success'); closeModal(); renderTable(); }
        else          GB.toast(res.error, 'error');
    } else {
        const res = GB.appointments.add({
            userEmail, userName, userId,
            serviceId, serviceName, date, status, notes
        });
        if (res.ok) { GB.toast('Takimi u shtua!', 'success'); closeModal(); renderTable(); }
        else          GB.toast(res.error, 'error');
    }
}

/* Delete / cancel */
function deleteAppt(id) {
    const a = GB.appointments.getById(id);
    if (!a) return;
    const msg = isAdmin
        ? `A jeni i sigurt që dëshironi të fshini takimin e ${a.userName}?`
        : 'A dëshironi të anuloni këtë takim?';
    if (!confirm(msg)) return;
    GB.appointments.delete(id);
    GB.toast(isAdmin ? 'Takimi u fshi!' : 'Takimi u anulua!', 'success');
    renderTable();
}

/* Close on backdrop */
document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

renderTable();
</script>
</body>
</html>
