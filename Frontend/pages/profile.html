<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Book - Profili</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="mobile-nav">
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    <span class="mobile-nav-logo">💅 Glow Book</span>
    <div style="width:40px"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout-wrap">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1 id="pageTitle">Profili</h1>
                <p>Detajet e plotë të llogarisë</p>
            </div>
            <!-- Back button — shown to admin when viewing other users -->
            <a class="btn-back" id="backBtn" href="admin.html#appointments" data-admin>
                <i class="fa-solid fa-arrow-left"></i> Kthehu
            </a>
        </div>

        <div class="profile-grid">

            <!-- LEFT: profile card + stats -->
            <div>
                <div class="profile-card">
                    <div class="avatar-big" id="avatar">?</div>
                    <div class="profile-name"  id="profileName">–</div>
                    <div class="profile-email" id="profileEmail">–</div>
                    <span class="badge" id="profileBadge">–</span>
                    <div class="profile-info">
                        <div class="info-row"><span class="info-label">Telefoni</span>     <span class="info-value" id="profilePhone">–</span></div>
                        <div class="info-row"><span class="info-label">Roli</span>         <span class="info-value" id="profileRole">–</span></div>
                        <div class="info-row"><span class="info-label">Anëtar që nga</span><span class="info-value" id="profileDate">–</span></div>
                    </div>
                </div>

                <div class="card" style="margin-top:1.25rem">
                    <div class="card-title">Statistikat</div>
                    <div class="stats-mini-3">
                        <div class="stat-box"><div class="n" id="stTotal">0</div><div class="l">Takime</div></div>
                        <div class="stat-box"><div class="n" id="stDone">0</div><div class="l">Kryer</div></div>
                        <div class="stat-box"><div class="n" id="stPend">0</div><div class="l">Në pritje</div></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: edit form + appointment history -->
            <div class="right-col">

                <div class="card">
                    <div class="card-title">Ndrysho të Dhënat</div>
                    <div class="edit-form">
                        <div class="field"><label>Emri</label>    <input type="text"  id="editName"></div>
                        <div class="field"><label>Email</label>   <input type="email" id="editEmail"></div>
                        <div class="field"><label>Telefoni</label><input type="text"  id="editPhone"></div>
                        <div class="field">
                            <label>Fjalëkalimi i Ri <small style="color:var(--text-muted)">(lëre bosh për të mbajtur)</small></label>
                            <input type="password" id="editPassword" placeholder="Fjalëkalim i ri...">
                        </div>
                        <button class="btn-save" onclick="saveProfile()">
                            <i class="fa-solid fa-floppy-disk"></i> Ruaj Ndryshimet
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span>Takimet</span>
                        <a href="admin.html#appointments" id="profileApptLink">Shiko të gjitha →</a>
                    </div>
                    <div id="apptList"><span style="color:var(--text-muted);font-size:.85rem">Duke ngarkuar...</span></div>
                </div>

            </div>
        </div>
    </main>
</div>

<div class="gb-toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script>
'use strict';
GB.init({ page: 'users' });

const isAdmin = GB.isAdmin();
const me      = GB.getMe();
let   userId  = null;
let   viewUser = null;
if (!isAdmin) {
    const apptLink = document.getElementById('profileApptLink');
    if (apptLink) apptLink.href = 'booking.html';
}

function load() {
    const params = new URLSearchParams(window.location.search);
    const reqId  = parseInt(params.get('id'));

    if (isAdmin && reqId) {
        /* Admin can view any profile */
        viewUser = GB.users.getById(reqId);
    } else {
        /* Clients can only view their own */
        if (reqId && reqId !== me?.id) {
            window.location.replace('dashboard.html');
            return;
        }
        viewUser = GB.users.getById(me?.id) || me;
        document.getElementById('backBtn').style.display = 'none';
    }

    if (!viewUser) { GB.toast('Përdoruesi nuk u gjet!', 'error'); return; }
    userId = viewUser.id;

    /* Populate profile card */
    const ini = viewUser.name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    document.getElementById('avatar').textContent       = ini;
    document.getElementById('pageTitle').textContent    = viewUser.name;
    document.getElementById('profileName').textContent  = viewUser.name;
    document.getElementById('profileEmail').textContent = viewUser.email;
    document.getElementById('profilePhone').textContent = viewUser.phone || '–';
    document.getElementById('profileRole').textContent  = viewUser.role;
    document.getElementById('profileDate').textContent  = viewUser.createdAt
        ? new Date(viewUser.createdAt).toLocaleDateString('sq-AL') : '–';

    const badge = document.getElementById('profileBadge');
    badge.textContent = viewUser.role;
    badge.className   = `badge ${viewUser.role === 'Admin' ? 'badge-admin' : 'badge-customer'}`;

    /* Pre-fill edit form */
    document.getElementById('editName').value  = viewUser.name;
    document.getElementById('editEmail').value = viewUser.email;
    document.getElementById('editPhone').value = viewUser.phone || '';

    /* Stats */
    const appts = GB.appointments.getByUser(viewUser.email);
    document.getElementById('stTotal').textContent = appts.length;
    document.getElementById('stDone').textContent  = appts.filter(a => a.status === 'Done').length;
    document.getElementById('stPend').textContent  = appts.filter(a => a.status === 'Pending').length;

    /* Recent appointments */
    const al = document.getElementById('apptList');
    if (!appts.length) {
        const addHref = isAdmin ? 'admin.html#appointments' : 'booking.html';
        al.innerHTML = `<div style="text-align:center;padding:1rem;color:var(--text-muted);font-size:.85rem">
            Nuk ka takime. <a href="${addHref}" style="color:var(--pink)">Shto →</a></div>`;
    } else {
        al.innerHTML = [...appts].reverse().slice(0, 5).map(a => {
            const bc   = a.status === 'Pending' ? 'badge-pending' : a.status === 'Confirmed' ? 'badge-confirmed' : 'badge-done';
            const date = new Date(a.date).toLocaleDateString('sq-AL');
            return `<div class="appt-item">
                <div class="appt-dot"></div>
                <div class="appt-info">
                    <div class="appt-name">${a.serviceName || 'Shërbim'}</div>
                    <div class="appt-date">${date}</div>
                </div>
                <span class="badge ${bc}">${a.status}</span>
            </div>`;
        }).join('');
    }
}

function saveProfile() {
    const name  = document.getElementById('editName').value.trim();
    const email = document.getElementById('editEmail').value.trim();
    const phone = document.getElementById('editPhone').value.trim();
    const pass  = document.getElementById('editPassword').value;

    if (!name)  { GB.toast('Shkruani emrin!', 'error'); return; }
    if (!email) { GB.toast('Shkruani email-in!', 'error'); return; }
    if (pass && pass.length < 4) { GB.toast('Fjalëkalimi duhet ≥ 4 karaktere!', 'error'); return; }

    const fields = { name, email, phone };
    if (pass) fields.password = pass;

    const res = GB.users.update(userId, fields);
    if (res.ok) {
        /* If editing own profile, refresh session */
        if (userId === me?.id) {
            GB._saveSession(res.user);
        }
        GB.toast('Të dhënat u përditësuan!', 'success');
        load();
    } else {
        GB.toast(res.error, 'error');
    }
}

load();
</script>
</body>
</html>
